[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-audit"
version = "0.1.0"
description = "Analisi una tantum della velocità dei template principali di un sito, con diagnosi e interventi assegnabili"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alessandro Fantini" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Solo se un giorno servisse un xlsx autonomo: va importata lazy dentro la
# funzione che la usa, e NON in requirements.txt, da cui installa Vercel.
# Oggi l'xlsx lo produce uno script esterno al repo, che consuma masterplan.json.
xlsx = ["openpyxl>=3.1"]

[project.scripts]
speed = "speed.cli:main"

[tool.vercel]
# Senza questo Vercel non sa quale app caricare: il progetto ha un pyproject.toml,
# quindi viene trattato come applicazione Python e cerca un entrypoint WSGI/ASGI.
entrypoint = "app:app"

[tool.setuptools.packages.find]
include = ["speed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

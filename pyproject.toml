[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-audit"
version = "0.1.0"
description = "Analisi una tantum della velocità dei template principali di un sito, con diagnosi e interventi assegnabili"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alessandro Fantini" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
speed = "speed.cli:main"

[tool.setuptools.packages.find]
include = ["speed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
